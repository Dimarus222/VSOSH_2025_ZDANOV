<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель | Кадетский Парламент</title>
<meta name="robots" content="noindex, nofollow">
<style>
    :root{--navy:#0B1A33;--navy2:#13294B;--gold:#FFB81C;--bg:#F5F7FA;--gray:#8D9AA9;--danger:#d32f2f;--ok:#2E7D32;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#1a1a1a;}
    header{background:var(--navy);color:#fff;padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;}
    header h1{font-size:1.1rem;font-weight:700;}
    header .right{display:flex;gap:0.6rem;align-items:center;font-size:0.9rem;}
    a.site-link{color:var(--gold);text-decoration:none;}
    button{cursor:pointer;font-family:inherit;}
    .btn{background:var(--gold);color:var(--navy);border:none;padding:0.55rem 1.1rem;border-radius:8px;font-weight:700;font-size:0.9rem;}
    .btn:hover{opacity:0.9;}
    .btn.secondary{background:#fff;color:var(--navy);border:1px solid #ccc;}
    .btn.danger{background:var(--danger);color:#fff;}
    .btn:disabled{opacity:0.5;cursor:not-allowed;}
    .wrap{max-width:1100px;margin:0 auto;padding:1.5rem;}
    #loginScreen{max-width:380px;margin:4rem auto;background:#fff;padding:2rem;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.08);}
    #loginScreen h2{margin-bottom:1.2rem;color:var(--navy);}
    #loginScreen input{width:100%;padding:0.7rem;margin-bottom:0.8rem;border:1px solid #ccc;border-radius:8px;font-size:1rem;}
    #loginScreen .err{color:var(--danger);font-size:0.85rem;margin-bottom:0.8rem;min-height:1.2em;}
    .tabs{display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:1.2rem;}
    .tab-btn{background:#fff;border:1px solid #ddd;padding:0.5rem 0.9rem;border-radius:20px;font-size:0.85rem;color:#333;}
    .tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
    .panel{background:#fff;border-radius:14px;padding:1.5rem;box-shadow:0 4px 16px rgba(0,0,0,0.06);margin-bottom:1.5rem;}
    .panel h3{color:var(--navy);margin-bottom:1rem;}
    label{display:block;font-size:0.85rem;font-weight:600;color:#444;margin:0.8rem 0 0.3rem;}
    input[type=text], input[type=email], textarea{width:100%;padding:0.6rem;border:1px solid #ccc;border-radius:8px;font-size:0.95rem;font-family:inherit;}
    textarea{min-height:80px;resize:vertical;}
    .save-row{margin-top:1rem;display:flex;gap:0.6rem;align-items:center;}
    .status-msg{font-size:0.85rem;}
    .status-msg.ok{color:var(--ok);}
    .status-msg.err{color:var(--danger);}
    .item-card{border:1px solid #e3e6ec;border-radius:10px;padding:1rem;margin-bottom:1rem;position:relative;background:#fafbfc;}
    .item-card .remove-btn{position:absolute;top:0.6rem;right:0.6rem;background:none;border:none;color:var(--danger);font-size:1.1rem;}
    .image-preview{max-width:140px;max-height:140px;border-radius:8px;display:block;margin:0.4rem 0;object-fit:cover;}
    .upload-row{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;}
    .achievements-editor textarea{min-height:100px;}
    .hint{font-size:0.8rem;color:var(--gray);margin-top:0.2rem;}
    .add-btn{margin-top:0.5rem;}
    #app{display:none;}
</style>
</head>
<body>

<div id="loginScreen">
    <h2>⚓ Вход в админ-панель</h2>
    <div class="err" id="loginErr"></div>
    <input type="text" id="loginUser" placeholder="Логин" autocomplete="username">
    <input type="password" id="loginPass" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%">Войти</button>
</div>

<div id="app">
    <header>
        <h1>⚓ Админ-панель — Кадетский Парламент</h1>
        <div class="right">
            <a class="site-link" href="/" target="_blank">Открыть сайт ↗</a>
            <span id="whoami"></span>
            <button class="btn secondary" id="logoutBtn">Выйти</button>
        </div>
    </header>
    <div class="wrap">
        <div class="tabs">
            <button class="tab-btn active" data-tab="hero">Главная</button>
            <button class="tab-btn" data-tab="history">История</button>
            <button class="tab-btn" data-tab="best_members">Лучшие кадеты</button>
            <button class="tab-btn" data-tab="activities">Деятельность</button>
            <button class="tab-btn" data-tab="documents">Документы</button>
            <button class="tab-btn" data-tab="contact">Контакты</button>
            <button class="tab-btn" data-tab="password">Пароль</button>
        </div>
        <div id="tabContent"></div>
    </div>
</div>

<script src="/admin.js"></script>
</body>
</html>
